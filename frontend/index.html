<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Personal Finance Tracker</h1>
        <ul class="nav nav-tabs mt-4" id="myTab" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="tracker-tab" data-toggle="tab" href="#tracker" role="tab">Tracker</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="reports-tab" data-toggle="tab" href="#reports" role="tab">Reports</a>
            </li>
        </ul>
        <div class="tab-content mt-3" id="myTabContent">
            <div class="tab-pane fade show active" id="tracker" role="tabpanel">
                <div class="row">
                    <div class="col-md-6">
                        <h3>Add Transaction</h3>
                        <form id="transactionForm">
                            <div class="form-group">
                                <label for="description">Description</label>
                                <input type="text" class="form-control" id="description" required>
                            </div>
                            <div class="form-group">
                                <label for="amount">Amount</label>
                                <input type="number" class="form-control" id="amount" required min="0.01" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="type">Type</label>
                                <select class="form-control" id="type" required>
                                    <option value="income">Income</option>
                                    <option value="expense">Expense</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select class="form-control" id="category" required>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Salary">Salary</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="date">Date</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Add Transaction</button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <h3>Current Balance</h3>
                        <h2 id="balance" class="text-success">Rs0.00</h2>
                        <h3>Total Income: <span id="totalIncome" class="text-success">Rs0.00</span></h3>
                        <h3>Total Expense: <span id="totalExpense" class="text-danger">Rs0.00</span></h3>
                        <h3>Transaction History</h3>
                        <ul class="list-group" id="transactionList"></ul>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade" id="reports" role="tabpanel">
                <h3>Financial Reports</h3>
                <div class="row">
                    <div class="col-md-6">
                        <h4>Expense by Category</h4>
                        <canvas id="expensePieChart"></canvas>
                    </div>
                    <div class="col-md-6">
                        <h4>Balance Over Time</h4>
                        <canvas id="balanceLineChart"></canvas>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-12">
                        <h4>Monthly Income vs Expenses</h4>
                        <canvas id="monthlyBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
